services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pipeline-backend
    env_file:
      - .env
    expose:
      - "8000"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - pipeline-network

  redis:
    image: redis:7-alpine
    container_name: pipeline-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    networks:
      - pipeline-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pipeline-frontend
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - pipeline-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: pipeline-nginx
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    restart: unless-stopped
    networks:
      - pipeline-network

networks:
  pipeline-network:
    driver: bridge

volumes:
  redis-data: